# Fly.io — KONSÜL AI  (önerilen hedef — DEPLOY.md "Seçenek 1")
# Kurulum:  fly login → fly launch --no-deploy → fly volumes create data -s 1 -r ist → fly deploy
# Not: app adı yalnız a-z, 0-9 ve "-"; region "ist" = İstanbul (düşük gecikme).
# App adı: yuvarlak-masa → URL: https://yuvarlak-masa.fly.dev
app = "yuvarlak-masa"
primary_region = "ist"

[build]

[http_service]
  internal_port = 8888
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# Uygulama sağlığı — bozulursa Fly kendiliğinden yeniden başlatır
[[checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/health"
  port = 8888
  retries = 3

[[mounts]]
  source = "data"
  destination = "/data"

[env]
  KONSUL_DB_PATH = "/data/konsul.db"
